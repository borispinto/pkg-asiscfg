[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-asiscfg"
version = "1.0.0"
description = "Librería modular y GUI de configuración cifrada"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Boris Pinto", email = "borispinto@asisnet.net" }
]
maintainers = [
    { name = "Asisnet Computacion, CA", email = "proyectos@asisnet.net" }
]
keywords = ["config", "fernet", "encryption", "customtkinter", "asisnet"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "cryptography>=3.0"
]

[project.urls]
Homepage = "https://www.asisnet.net"
Repository = "https://github.com/borispinto/pkg-asiscfg"
Issues = "https://github.com/borispinto/pkg-asiscfg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["asiscfg*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.png"]

[tool.pyright]
extraPaths = [
    "../pkg-i18n",
    "../pkg-asisdb",
    "../PKG-i18n",
    "../PKG-asisdb"
]