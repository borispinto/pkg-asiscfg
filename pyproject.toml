# File: pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-asiscfg"
version = "1.0.0"
description = "Librería modular y GUI de configuración cifrada de alto rendimiento"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

# 1. Tu marca personal como Autor Principal
authors = [
    { name = "Boris Pinto", email = "borispinto@gmail.com" }
]

# 2. Tu empresa como el canal oficial de Soporte y Negocios
maintainers = [
    { name = "ASISNET Computación, CA", email = "proyectos@asisnet.net" }
]

keywords = ["config", "fernet", "encryption", "tkinter", "gui", "security", "asisnet"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: User Interfaces"
]

dependencies = [
    "cryptography>=40.0.0",
    "customtkinter>=6.0.0",
    "pillow>=10.0.0",
    "pkg-i18n>=1.0.0",
    "pkg-asisdb>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pyinstaller-hooks-contrib>=2024.0"
]

[project.urls]
Homepage = "https://www.asisnet.net"
Repository = "https://github.com/borispinto/pkg-asiscfg"
Issues = "https://github.com/borispinto/pkg-asiscfg/issues"

[project.scripts]
asiscfg = "asiscfg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asiscfg*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.png"]
